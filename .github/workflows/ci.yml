name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called from docker-publish.yml, so the two
  # runs of CI for one push do not cancel each other
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Lint seed library
        run: uv run python ../tools/lint_seed.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile --build-arg PV_REVISION=${{ github.sha }} -t promptvault:ci .
      - name: Smoke test (health, seed, non-root, restart persistence, export, size ceiling)
        run: bash tools/docker_smoke.sh promptvault:ci
      - name: Vulnerability scan (informational, does not fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 promptvault:ci | tee scan.txt
          { echo '### Trivy (HIGH, CRITICAL, fixable)'; echo '```'; cat scan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  postgres:
    name: PostgreSQL smoke test (experimental)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pv
          POSTGRES_PASSWORD: pvtest
          POSTGRES_DB: pv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pv -d pv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra postgres
      - run: uv run python ../tools/pg_smoke.py
        env:
          PV_PG_URL: postgresql+psycopg://pv:pvtest@localhost:5432/pv
