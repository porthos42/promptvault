# Prompt Vault with PostgreSQL. EXPERIMENTAL: see the notes in README.md and docs/SPEC.md.
#
# Tested: the migration chain and the API (list, filters, create, update, revisions, export in all
# four formats, import incl. background jobs) against postgres 16. NOT available on PostgreSQL:
# full-text search ranking and typo correction (search falls back to a plain substring match),
# so results are unranked. Not tested: upgrades of real data, backups, large libraries.
#
# The published image has no PostgreSQL driver (it would push the image past 200 MB), so this file
# builds a variant with the "postgres" extra from this checkout. From the repo root:
#   cp .env.example .env     # then set POSTGRES_PASSWORD
#   docker compose -f docker/compose.postgres.yml --env-file .env up -d --build
#
# WARNING: Prompt Vault v1 has NO authentication. The port is published on the loopback
# interface only; do not expose it to the internet.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promptvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-promptvault}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  promptvault:
    image: promptvault:postgres
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        EXTRAS: xlsx,postgres
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PV_BIND:-127.0.0.1}:${PV_HOST_PORT:-8080}:8080"
    environment:
      # the password must be URL-safe (letters, digits, - _ . ~), or percent-encoded
      PV_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-promptvault}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-promptvault}
      PV_LOG_LEVEL: ${PV_LOG_LEVEL:-info}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pg-data:
