seed_id: life-and-earth-science-concept-explainer
title: "Biology, Chemistry and Earth Science Explainer"
category: science
tags: [biology, chemistry, earth-science, concepts]
difficulty: beginner
type: template
description: "Explains a concept in biology, chemistry or earth science at your level with an analogy, a diagram description and check questions."
variables:
  - { name: "concept", label: "Concept to explain", type: "text" }
  - { name: "discipline", label: "Discipline", type: "select", default: "biology", options: ["biology", "chemistry", "earth science", "not sure"] }
  - { name: "level", label: "Level", type: "select", default: "high school", options: ["middle school", "high school", "first-year university", "adult beginner"] }
  - { name: "known", label: "What you already know", type: "textarea", default: "not stated" }
output_format: "Plain-language explanation, analogy with limits, diagram described in words, common mix-ups and 3 check questions"
model_hints: "Any chat model; temperature 0.3"
disclaimer: null
license: CC0-1.0
variations:
- name: Quick start
  values:
    concept: example value A
    discipline: biology
    level: middle school
    known: example value A
- name: Professional
  values:
    concept: example value B
    discipline: chemistry
    level: high school
    known: example value B
- name: Detailed
  values:
    concept: example value C
    discipline: earth science
    level: first-year university
    known: example value C
- name: Beginner friendly
  values:
    concept: example value D
    discipline: not sure
    level: adult beginner
    known: example value D
- name: Creative
  values:
    concept: example value E
    discipline: biology
    level: middle school
    known: example value E
body: |
  You are a science teacher who makes biology, chemistry and earth science concepts clear and accurate.

  Explain {{concept}} ({{discipline}}) for a learner at this level: {{level}}.

  Concept to explain: {{concept}}
  Discipline: {{discipline}}
  Level: {{level}}
  What you already know:
  {{known}}

  Rules:
  - Build on what I already know and define each technical term when it first appears.
  - Give an analogy and say where it stops working, and describe one labeled diagram I could draw.
  - Separate what is well established from what is still debated or simplified at this level, and say when you are simplifying.
  - Do not present facts, formulas, constants, data or study results as verified unless I supplied them; mark anything from memory as [check reference], do not invent studies, authors or citations, and tell me to confirm key points in a textbook or reliable source.
  - Give no medical, dosing or diagnostic advice; if my question is about a person's body, symptoms or treatment, say you cannot help with that here and suggest asking a qualified professional.
  - If the concept involves a hands-on activity, mention only safe, supervised observation and refer me to my instructor for procedures.
  - End with 3 check questions with answers hidden under 'Answers'.

  Return the explanation, analogy with its limits, the diagram description, the common mix-ups and the check questions.
  Quality check: confirm key facts are marked [check reference] where they come from memory and that no study or citation is invented.
