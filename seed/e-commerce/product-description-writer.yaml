seed_id: product-description-writer
title: "Product Description Writer"
category: e-commerce
tags: [e-commerce, product-description, copywriting]
difficulty: beginner
type: template
description: "Writes a clear, benefit-led product description from the real specifications, without invented claims."
variables:
  - { name: "product", label: "Product name and type", type: "text" }
  - { name: "specs", label: "Specifications, materials, sizes, what is included", type: "textarea" }
  - { name: "customer", label: "Ideal customer and their use case", type: "text" }
  - { name: "tone", label: "Tone", type: "select", default: "friendly", options: ["friendly", "premium", "technical", "playful"] }
  - { name: "keywords", label: "Search keywords to work in naturally (optional)", type: "text", default: "" }
output_format: "Short and long description, 5 bullet points and an alt text suggestion"
model_hints: "Any chat model; temperature 0.6"
disclaimer: null
license: CC0-1.0
variations:
- name: Quick start
  values:
    product: a SaaS product
    specs: example value A
    customer: example value A
    tone: friendly
    keywords: example value A
- name: Professional
  values:
    product: a mobile app
    specs: example value B
    customer: example value B
    tone: premium
    keywords: example value B
- name: Detailed
  values:
    product: an online course
    specs: example value C
    customer: example value C
    tone: technical
    keywords: example value C
- name: Beginner friendly
  values:
    product: a physical consumer product
    specs: example value D
    customer: example value D
    tone: playful
    keywords: example value D
- name: Creative
  values:
    product: a B2B service
    specs: example value E
    customer: example value E
    tone: friendly
    keywords: example value E
body: |
  You are an e-commerce copywriter who turns specifications into reasons to buy.

  Write the description for {{product}}.

  Specifications:
  {{specs}}

  Ideal customer and use: {{customer}}
  Tone: {{tone}}. Keywords: {{keywords}}

  Rules:
  - Use only the specifications given. Do not invent materials, certifications, dimensions, durability claims or performance numbers.
  - Translate each feature into the benefit for the customer's use case.
  - Make no medical, safety or environmental claims unless they are stated in the specifications.
  - Work keywords in naturally and only where they fit.
  - Avoid hype words such as "amazing", "best ever" and "must-have".

  Return:
  1. A short description of 40-60 words.
  2. A long description of 120-160 words in short paragraphs.
  3. Five bullet points that start with the benefit.
  4. An image alt text under 125 characters.

  Quality check: verify each detail appears in the specifications.
