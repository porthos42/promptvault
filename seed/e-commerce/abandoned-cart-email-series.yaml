seed_id: abandoned-cart-email-series
title: "Abandoned Cart Email Series"
category: e-commerce
tags: [e-commerce, email, retention]
difficulty: intermediate
type: chain
description: "A chain that plans a 3-email abandoned cart flow, then writes each email honestly without fake urgency."
variables:
  - { name: "store", label: "Store name and what it sells", type: "text" }
  - { name: "brand_voice", label: "Brand voice", type: "text", default: "friendly and straightforward" }
  - { name: "incentive", label: "Incentive you are willing to offer (or none)", type: "text", default: "none" }
  - { name: "policies", label: "Shipping and returns facts to mention", type: "textarea" }
  - { name: "sender", label: "Sender name", type: "text", default: "[Store Team]" }
output_format: "Plan table and 3 emails with subject, preview text, body and call to action"
model_hints: "Any chat model; temperature 0.6"
disclaimer: null
license: CC0-1.0
variations:
- name: Quick start
  values:
    store: example value A
    brand_voice: example value A
    incentive: example value A
    policies: example value A
    sender: example value A
- name: Professional
  values:
    store: example value B
    brand_voice: example value B
    incentive: example value B
    policies: example value B
    sender: example value B
- name: Detailed
  values:
    store: example value C
    brand_voice: example value C
    incentive: example value C
    policies: example value C
    sender: example value C
- name: Beginner friendly
  values:
