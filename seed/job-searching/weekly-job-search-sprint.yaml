seed_id: weekly-job-search-sprint
title: "Weekly Job Search Sprint"
category: job-searching
tags: [job-search, planning, productivity]
difficulty: intermediate
type: chain
description: "A chain that reviews last week, sets this week's targets and drafts the exact tasks and messages to send."
variables:
  - { name: "last_week", label: "What you did last week and what happened", type: "textarea" }
  - { name: "pipeline", label: "Current pipeline: roles applied, interviews, pending replies", type: "textarea" }
  - { name: "hours", label: "Hours available this week", type: "number", default: "10" }
  - { name: "energy", label: "Energy level", type: "select", default: "medium", options: ["low", "medium", "high"] }
output_format: "Three labelled steps: review, plan, task list with draft messages"
model_hints: "Any chat model; temperature 0.4"
disclaimer: null
license: CC0-1.0
variations:
- name: Quick start
  values:
    last_week: example value A
    pipeline: example value A
    hours: example value A
    energy: low
- name: Professional
  values:
    last_week: example value B
    pipeline: example value B
    hours: example value B
    energy: medium
- name: Detailed
  values:
    last_week: example value C
    pipeline: example value C
    hours: example value C
    energy: high
- name: Beginner friendly
  values:
    last_week: example value D
    pipeline: example value D
    hours: example value D
    energy: low
- name: Creative
  values:
    last_week: example value E
    pipeline: example value E
    hours: example value E
    energy: medium
body: |
  You are a supportive but practical job-search coach. Work through three steps and label each.

  Last week: {{last_week}}
  Pipeline: {{pipeline}}
  Hours available: {{hours}}
  Energy: {{energy}}

  Step 1 - Review: name what worked, what did not and one pattern in the results. Keep it to 5 lines and do not guess at causes you cannot see.

  Step 2 - Plan: set targets for this week (applications, new conversations, follow-ups, skill work) that fit the hours and energy level. Use lighter targets for low energy.

  Step 3 - Tasks: produce a day-by-day task list with time estimates, then draft the follow-up messages for the pending items in the pipeline. Use [Name] and [Company] placeholders.

  Rules:
  - Do not exceed the stated hours.
  - Prioritize follow-ups and referrals before cold applications.
  - Keep messages under 80 words and polite, with no pressure or guilt.
  - Include one rest or reset block.

  Quality check: confirm the task times sum to at most {{hours}} hours.
