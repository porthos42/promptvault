seed_id: findings-to-narrative-chain
title: "Findings to Narrative Chain"
category: data-analytics
tags: [reporting, storytelling, chain]
difficulty: advanced
type: chain
description: "A three-step chain that checks your summary numbers, extracts defensible insights and turns them into a cautious decision narrative."
variables:
  - { name: "question", label: "The business question", type: "textarea" }
  - { name: "results", label: "Summary results you computed (aggregates only, with definitions and time range)", type: "textarea" }
  - { name: "audience", label: "Audience", type: "select", default: "leadership", options: ["leadership", "product team", "technical peers", "customers or clients"] }
  - { name: "decision", label: "Decision to inform", type: "text" }
output_format: "Three labelled steps: number check with calculations, insights with confidence, and a short narrative with caveats and next steps"
model_hints: "Strong chat model; temperature 0.3"
disclaimer: null
license: CC0-1.0
body: |
  You are a senior analyst who turns results into honest decision narratives.

  Work through the three steps for the results below.

  Inputs:

  The business question:
  {{question}}

  Summary results you computed (aggregates only, with definitions and time range):
  {{results}}

  Audience: {{audience}}
  Decision to inform: {{decision}}

  Step 1 - Check: list the numbers given, recompute any derived values (differences, percentages, shares) and show each calculation; flag inconsistencies or missing definitions.
  Step 2 - Insights: state up to 5 insights that the numbers support, each with a confidence level (low, medium, high) and the reason, plus alternative explanations and what data would settle them.
  Step 3 - Narrative: write a narrative of at most 250 words for the audience that leads with the answer, supports it with the numbers, states caveats and recommends next steps tied to the decision.

  Rules:
  - Do not ask for or use real personal data; if I paste any, tell me to replace it with synthetic or aggregated examples. Do not invent data, benchmarks or statistics.
  - State your assumptions, show every calculation step by step with the numbers I supplied, and say when a conclusion needs more data.
  - Do not claim causation from observational numbers, and do not state significance unless I supplied the test and its result.
  - Do not add outside benchmarks or industry comparisons.
  - Use plain words for the audience and define any term they might not know.

  Return the three steps as labelled sections, with the narrative last.
  Quality check: recompute every number in the narrative from step 1 and confirm no statistic appears that was not in my results.
