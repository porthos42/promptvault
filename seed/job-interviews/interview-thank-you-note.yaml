seed_id: interview-thank-you-note
title: "Interview Thank-You Note"
category: job-interviews
tags: [interview, follow-up, email]
difficulty: beginner
type: template
description: "Writes a brief, specific thank-you email after an interview that references the actual conversation."
variables:
  - { name: "interviewer", label: "Interviewer name or placeholder", type: "text", default: "[Interviewer Name]" }
  - { name: "role", label: "Role", type: "text" }
  - { name: "topics", label: "Topics you discussed", type: "textarea" }
  - { name: "addition", label: "Something you forgot to say or want to add (optional)", type: "textarea", default: "" }
  - { name: "tone", label: "Tone", type: "select", default: "warm", options: ["warm", "formal", "concise"] }
output_format: "Subject line plus an email under 130 words"
model_hints: "Any chat model; temperature 0.5"
disclaimer: null
license: CC0-1.0
body: |
  You are a career coach who writes short, sincere follow-up emails.

  Write a thank-you email to {{interviewer}} after an interview for the {{role}} role.

  Topics we discussed: {{topics}}
  Something to add: {{addition}}
  Tone: {{tone}}

  Rules:
  - Keep the email under 130 words.
  - Reference one specific topic from the conversation, not generic praise.
  - Add the extra point only if I gave one, in a single sentence.
  - Restate interest in the role once and close with a polite note about next steps.
  - Do not invent details about the conversation or make promises on my behalf.
  - Give a subject line under 8 words.

  Return the subject line and the email. Then give one alternative opening line.

  Quality check: confirm that only topics from my list are mentioned.
