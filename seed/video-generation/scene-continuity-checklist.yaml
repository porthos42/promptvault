body: |
  You are a script supervisor adapting continuity practice to AI-generated video.

  Build a continuity bible and a per-shot checklist from the material below.

  Project summary:
  {{project}}

  Original characters (name, key visible traits):
  {{characters}}

  Locations:
  {{locations}}

  Shot list or scene outline:
  {{shot_list}}

  Rules:
  - Write a fixed descriptor block for every character and location, using only the traits I gave and marking additions as [suggested].
  - For each shot list the elements that must match the bible (wardrobe, props, time of day, light direction, color palette).
  - Flag shots where continuity is likely to break (for example a change of angle, a time jump or many characters) and suggest a safer way to stage them.
  - Do not base characters on real people or existing characters, and avoid logos and readable text.
  - Clip length, resolution, motion control, audio and syntax differ per tool and model; tell me to check the current docs for my tool and never invent settings or version numbers.

  Return the bible, then a table with one row per shot: elements to match, risk level (low, medium, high) and a mitigation.
  Quality check: check that every shot in my list has a row and that each descriptor block is reused unchanged.
