seed_id: scene-continuity-checklist
title: "Scene Continuity Bible and Checklist"
category: video-generation
tags: [video-generation, continuity, consistency]
difficulty: intermediate
type: template
description: "Creates a continuity bible and per-shot checklist so characters, props, wardrobe and lighting match across separately generated clips."
variables:
  - { name: "project", label: "Project summary", type: "textarea" }
  - { name: "characters", label: "Original characters (name, key visible traits)", type: "textarea" }
  - { name: "locations", label: "Locations", type: "textarea" }
  - { name: "shot_list", label: "Shot list or scene outline", type: "textarea" }
output_format: "Continuity bible (fixed descriptor blocks) and a per-shot checklist with risk notes"
model_hints: "Any chat model; temperature 0.8"
disclaimer: null
license: CC0-1.0
variations:
- name: Quick start
  values:
    project: example value A
    characters: example value A
    locations: example value A
    shot_list: example value A
- name: Professional
  values:
    project: example value B
    characters: example value B
    locations: example value B
    shot_list: example value B
- name: Detailed
  values:
    project: example value C
    characters: example value C
    locations: example value C
    shot_list: example value C
- name: Beginner friendly
  values:
