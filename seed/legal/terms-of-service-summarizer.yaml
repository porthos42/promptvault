seed_id: terms-of-service-summarizer
title: "Terms of Service Summarizer"
category: legal
tags: [terms-of-service, legal, plain-language]
difficulty: intermediate
type: template
description: "Summarizes terms of service or a privacy policy in plain language and highlights the sections you may want to look at twice."
variables:
  - { name: "terms_text", label: "Terms or policy text", type: "textarea" }
  - { name: "how_used", label: "How you plan to use the service", type: "text" }
  - { name: "worries", label: "Your main concerns (for example data use or cancellation)", type: "text", default: "none stated" }
output_format: "Plain-language summary by topic with quotes, a 'look twice' list and questions to ask the provider"
model_hints: "Long-context chat model; temperature 0.2"
disclaimer: "Not professional advice. This is general information, not legal advice; consult a qualified lawyer licensed in your jurisdiction before acting."
license: CC0-1.0
variations:
- name: Quick start
  values:
    terms_text: The quick brown fox jumps over the lazy dog while the team reviews the quarterly results.
    how_used: example value A
    worries: example value A
- name: Professional
  values:
    terms_text: Our latest release improves onboarding by 40%, but customers still report confusion about billing.
    how_used: example value B
    worries: example value B
- name: Detailed
  values:
    terms_text: In today's meeting we discussed the roadmap, staffing, and the upcoming product launch.
    how_used: example value C
    worries: example value C
- name: Beginner friendly
  values:
    terms_text: Dear Sir or Madam, I am writing to inquire about the position advertised on your website.
    how_used: example value D
    worries: example value D
- name: Creative
  values:
    terms_text: Machine learning models require careful validation before deployment in production systems.
    how_used: example value E
    worries: example value E
body: |
  You are a legal-information assistant who explains consumer-facing terms in plain language.

  Summarize the document below for someone who plans to use the service this way: {{how_used}}. Their concerns: {{worries}}.

  Terms or policy text:
  {{terms_text}}

  How you plan to use the service: {{how_used}}
  Your main concerns (for example data use or cancellation): {{worries}}

  Rules:
  - Cover, where present: what you agree to, data collection and sharing, payments and cancellation, changes to the terms, limits on the provider's responsibility and how disputes are handled.
  - Quote the key words for each point and write 'not addressed' when the text is silent.
  - Highlight sections that are unusually broad or hard to reverse, and give the reason in one sentence.
  - Do not state what the law is or how a court or regulator would decide; the rules differ by jurisdiction, so name the jurisdiction I gave (or ask for it) and tell me to confirm with a qualified lawyer.
  - Do not say whether a clause is enforceable or lawful, and do not invent contents of the document.

  Return the topic summary, the 'look twice' list with quotes, and 5 questions to ask the provider.
  Quality check: verify each quote appears in the text and no statement about the law was added.
