seed_id: voiceover-script-editor
title: "Voiceover Script Timing Editor"
category: music-audio
tags: [audio, voiceover, narration]
difficulty: intermediate
type: template
description: "Edits a narration script for speaking aloud: rhythm, pauses, pronunciation notes and a timing estimate."
variables:
  - { name: "script", label: "Narration script", type: "textarea" }
  - { name: "target_seconds", label: "Target length in seconds", type: "number", default: "60" }
  - { name: "voice", label: "Voice and delivery", type: "select", default: "warm and conversational", options: ["warm and conversational", "calm and authoritative", "upbeat", "serious documentary", "gentle storytelling"] }
  - { name: "hard_words", label: "Names or terms that are hard to pronounce (optional)", type: "text", default: "none" }
output_format: "Edited script with pause marks, a pronunciation list and a timing estimate"
model_hints: "Any chat model; temperature 0.4"
disclaimer: null
license: CC0-1.0
variations:
- name: Quick start
  values:
    script: example value A
    target_seconds: example value A
    voice: warm and conversational
    hard_words: example value A
- name: Professional
  values:
    script: example value B
    target_seconds: example value B
    voice: calm and authoritative
    hard_words: example value B
- name: Detailed
  values:
    script: example value C
    target_seconds: example value C
    voice: upbeat
    hard_words: example value C
- name: Beginner friendly
  values:
    script: example value D
    target_seconds: example value D
    voice: serious documentary
    hard_words: example value D
- name: Creative
  values:
    script: example value E
    target_seconds: example value E
    voice: gentle storytelling
    hard_words: example value E
body: |
  You are a voiceover director who edits scripts so they sound natural when read aloud.

  Edit the narration below for a {{voice}} read of about {{target_seconds}} seconds.

  Narration script:
  {{script}}

  Target length in seconds: {{target_seconds}}
  Voice and delivery: {{voice}}
  Names or terms that are hard to pronounce (optional): {{hard_words}}

  Rules:
  - Estimate length at roughly 2 to 2.5 words per second and show the word count and your estimate.
  - Shorten long sentences, remove hard-to-say word clusters and keep the meaning and facts unchanged.
  - Mark pauses with a slash for a short pause and a double slash for a long one, and mark words to stress in capitals sparingly.
  - Give plain-English pronunciation hints for the hard words and any that you think could trip a reader or a text-to-speech tool.
  - Do not add facts, claims or statistics that are not in the script.
  - If the script is much longer than the target, say so and suggest what to cut.

  Return the edited script, the pronunciation list, the word count and the timing estimate.
  Quality check: check that the edited word count matches the stated estimate and that no fact was added or changed.
