seed_id: retirement-readiness-questions
title: "Retirement Readiness Questions"
category: retirement-planning
tags: [retirement, finance, planning]
difficulty: beginner
type: template
description: "Turns your age, goal and savings snapshot into a readiness question list and gap summary to take to an advisor - with no projections invented."
variables:
  - { name: current_age, label: "Your current age", type: "text" }
  - { name: age_goal, label: "Age you would like to retire", type: "text" }
  - { name: savings, label: "Your savings snapshot", type: "textarea" }
  - { name: income, label: "Current income", type: "textarea" }
  - { name: currency, label: "Currency", type: "text", default: "" }
output_format: "Position summary, grouped readiness questions, gaps and 3 advisor questions"
model_hints: "Any chat model; temperature 0.2"
disclaimer: "Not professional advice. This is general information, not financial, tax or investment advice; consult a qualified financial or tax advisor before acting."
license: CC0-1.0
variations:
- name: Quick start
  values:
    current_age: '35'
    age_goal: '55'
    savings: 401k $120,000, IRA $30,000, cash $20,000
    income: Salary $4,000/month plus $800/month rental
    currency: USD
- name: Professional
  values:
    current_age: '45'
    age_goal: '62'
    savings: Employer pension plus $85,000 in index funds
    income: 'Freelance income varies: $2,000-$4,000/month'
    currency: EUR
- name: Detailed
  values:
    current_age: '52'
    age_goal: '65'
    savings: Nothing saved yet; starting from zero
    income: W-2 job $90,000/year with an uncertain bonus
    currency: GBP
- name: Beginner friendly
  values:
    current_age: '60'
    age_goal: '67'
    savings: $250,000 spread across two accounts
    income: Expected pension $1,800/month at age 67
    currency: CAD
- name: Creative
  values:
    current_age: '28'
    age_goal: '50'
    savings: Roth IRA $15,000, employer plan $40,000
    income: 'Two incomes: $5,500/month combined'
    currency: AUD
body: |
  You are a structured retirement planning assistant who asks questions instead of projecting numbers.

  Using only my snapshot, prepare a retirement readiness question list.

  Current age: {{current_age}}
  Target retirement age: {{age_goal}}
  Savings snapshot:
  {{savings}}

  Current income:
  {{income}}

  Currency: {{currency}}

  Rules:
  - Use only my figures; write [amount?] for anything missing.
  - Do not project balances, growth rates, inflation or retirement dates.
  - Do not tell me whether I am on track or behind; that is an advisor's judgement with full data.
  - Organise questions into themes: income sources, expenses, accounts, healthcare, timing.

  Return a two-line summary of what I stated, readiness questions grouped by theme, the biggest information gaps in my snapshot, and 3 questions to open an advisor conversation.
  Quality check: confirm no growth assumptions or on-track judgements appear.