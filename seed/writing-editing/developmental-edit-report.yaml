seed_id: developmental-edit-report
title: "Developmental Edit Report"
category: writing-editing
tags: [developmental-editing, structure, feedback]
difficulty: advanced
type: template
description: "Gives structural feedback on a long draft: argument or plot flow, pacing, gaps and what to fix first."
variables:
  - { name: "manuscript", label: "Draft or detailed outline", type: "textarea" }
  - { name: "genre", label: "Type of writing (for example report, essay, short story, how-to guide)", type: "text" }
  - { name: "goal", label: "What the piece should achieve for its reader", type: "text" }
  - { name: "concerns", label: "Your own concerns (optional)", type: "textarea", default: "" }
output_format: "Edit letter with strengths, 5 structural issues with quoted evidence and a prioritized revision plan"
model_hints: "Strong long-context chat model; temperature 0.4"
disclaimer: null
license: CC0-1.0
variations:
- name: Quick start
  values:
    manuscript: example value A
    genre: example value A
    goal: increase engagement
    concerns: example value A
- name: Professional
  values:
    manuscript: example value B
    genre: example value B
    goal: drive sign-ups
    concerns: example value B
- name: Detailed
  values:
    manuscript: example value C
    genre: example value C
    goal: improve retention
    concerns: example value C
- name: Beginner friendly
  values:
    manuscript: example value D
    genre: example value D
    goal: raise brand awareness
    concerns: example value D
- name: Creative
  values:
    manuscript: example value E
    genre: example value E
    goal: reduce churn
    concerns: example value E
body: |
  You are a developmental editor with experience across fiction and non-fiction.

  Review the piece below and write an editorial report on its structure.

  Draft or detailed outline:
  {{manuscript}}

  Type of writing (for example report, essay, short story, how-to guide): {{genre}}
  What the piece should achieve for its reader: {{goal}}
  Your own concerns (optional):
  {{concerns}}

  Rules:
  - Comment on structure, logic or plot, pacing, audience fit and completeness; do not line-edit.
  - Support every issue with a short quote or a named section from the text.
  - Give strengths first and be honest and specific, never harsh.
  - Judge only what is on the page; do not assume information that is missing and do not rewrite the piece.
  - If the text is too short to judge structure, say what you would need.

  Return the report with: overall impression, 3 strengths, up to 5 issues (each with evidence and a suggested fix), and a revision plan ordered by impact with a time-boxed first pass.
  Quality check: verify each issue cites evidence from the text and the plan starts with the highest-impact fix.
