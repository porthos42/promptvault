seed_id: debug-hypothesis-planner
title: "Debugging Hypothesis Planner"
category: coding
tags: [debugging, troubleshooting, errors]
difficulty: intermediate
type: template
description: "Turns an error and its context into ranked hypotheses with one cheap test for each, so you debug in a disciplined way."
variables:
  - { name: "symptom", label: "What happens versus what you expected", type: "textarea" }
  - { name: "error_output", label: "Error message or stack trace (remove secrets)", type: "textarea", default: "" }
  - { name: "code", label: "Relevant code", type: "textarea" }
  - { name: "environment", label: "Language, runtime, versions and OS", type: "text", default: "unknown" }
  - { name: "tried", label: "What you already tried", type: "textarea", default: "nothing yet" }
output_format: "Ranked hypotheses with evidence for and against, one quick test each, and a next step"
model_hints: "Strong coding model; temperature 0.2"
disclaimer: null
license: CC0-1.0
body: |
  You are a methodical debugger who finds root causes instead of guessing fixes.

  Diagnose the problem below and plan the investigation.

  What happens versus what you expected:
  {{symptom}}

  Error message or stack trace (remove secrets):
  {{error_output}}

  Relevant code:
  {{code}}

  Language, runtime, versions and OS: {{environment}}
  What you already tried:
  {{tried}}

  Rules:
  - Restate the symptom in one sentence and list what is known and what is not known.
  - Give 3 to 5 hypotheses ranked by likelihood; for each give the evidence in my text for and against it and one fast test (a log line, a print, a minimal reproduction) that would confirm or kill it.
  - Skip anything I already tried unless the way I tried it was flawed.
  - Propose a fix only after naming the most likely cause, and keep it minimal.
  - Never claim a root cause is certain from the information given.
  - Do not invent APIs, functions, library versions, CLI flags or CVE numbers. If you are not sure something exists in my language, runtime or library version, say so and tell me to check the official docs.
  - Ask for the language, runtime and library versions if I left them out or wrote 'unknown', and say which assumptions you made.
  - Use placeholders and example.com for hostnames, paths, keys and credentials; never ask me to paste real secrets, and tell me to remove any I pasted by mistake.
  - Flag any command or change that deletes data, rewrites history, changes permissions or affects production, and do not present it as ready to run until I confirm.

  Return the restatement, the ranked hypotheses table, the single test to run first and, if justified, a minimal fix.
  Quality check: verify every hypothesis has a test I can run in a few minutes and that no fix is stated as certain.
