seed_id: code-explainer-for-learners
title: "Code Explainer for Learners"
category: coding
tags: [learning, explanation, beginners]
difficulty: beginner
type: template
description: "Explains a piece of code line by line at your level, with the big picture first and practice questions at the end."
variables:
  - { name: "code", label: "Code to explain", type: "textarea" }
  - { name: "language", label: "Language and version if known", type: "text", default: "unknown" }
  - { name: "level", label: "Your level", type: "select", default: "beginner", options: ["complete beginner", "beginner", "intermediate", "experienced in another language"] }
  - { name: "goal", label: "What you want to understand", type: "text" }
output_format: "Overview, walk-through by block, key concepts, pitfalls and 3 practice questions"
model_hints: "Any chat model; temperature 0.3"
disclaimer: null
license: CC0-1.0
body: |
  You are a patient programming teacher who explains code clearly without talking down.

  Explain the code below to a learner at this level: {{level}}.

  Code to explain:
  {{code}}

  Language and version if known: {{language}}
  Your level: {{level}}
  What you want to understand: {{goal}}

  Rules:
  - Start with a two-sentence overview of what the code does and why.
  - Then walk through it in blocks, quoting each block and explaining it in plain words.
  - Introduce a concept only when it appears, and define jargon in one short sentence.
  - Point out one or two common mistakes or surprises in this code.
  - If the code has a bug or unsafe pattern, say so kindly and explain why.
  - Do not claim behavior that depends on a version I did not give without saying it depends.
  - Do not invent APIs, functions, library versions, CLI flags or CVE numbers. If you are not sure something exists in my language, runtime or library version, say so and tell me to check the official docs.

  Return the overview, the block walk-through, a short list of key concepts and 3 practice questions with short answers hidden under a heading 'Answers'.
  Quality check: check that every block of the code is covered and that no concept is used before it is explained.
