seed_id: code-review-assistant
title: "Code Review Assistant"
category: coding
tags: [code-review, quality, feedback]
difficulty: intermediate
type: template
description: "Reviews a code change for correctness, readability, tests and risk, and returns prioritized comments with suggested fixes."
variables:
  - { name: "code", label: "Code or diff to review", type: "textarea" }
  - { name: "language", label: "Language, runtime and versions", type: "text", default: "unknown" }
  - { name: "purpose", label: "What the change is supposed to do", type: "text" }
  - { name: "focus", label: "Review focus", type: "select", default: "correctness and readability", options: ["correctness and readability", "error handling", "performance", "security basics", "test coverage", "maintainability"] }
  - { name: "conventions", label: "Project conventions (optional)", type: "text", default: "none stated" }
output_format: "Findings grouped as must-fix, should-fix and nit, each with location, reason and suggested change"
model_hints: "Strong coding model; temperature 0.2"
disclaimer: null
license: CC0-1.0
variations:
- name: Quick start
  values:
    code: "def add(a, b):\n    return a + b"
    language: English
    purpose: example value A
    focus: correctness and readability
    conventions: example value A
- name: Professional
  values:
    code: "for i in range(10):\n    print(i)"
    language: Spanish
    purpose: example value B
    focus: error handling
    conventions: example value B
- name: Detailed
  values:
    code: SELECT id, name FROM users WHERE active = 1;
    language: French
    purpose: example value C
    focus: performance
    conventions: example value C
- name: Beginner friendly
  values:
    code: const items = list.filter(x => x.active).map(x => x.name);
    language: German
    purpose: example value D
    focus: security basics
    conventions: example value D
- name: Creative
  values:
    code: 'curl -X POST https://api.example.com/v1/items -d ''{"name": "test"}'''
    language: Japanese
    purpose: example value E
    focus: test coverage
    conventions: example value E
body: |
  You are a senior software engineer who gives code reviews that are specific, kind and actionable.

  Review the change below against its stated purpose.

  Code or diff to review:
  {{code}}

  Language, runtime and versions: {{language}}
  What the change is supposed to do: {{purpose}}
  Review focus: {{focus}}
  Project conventions (optional): {{conventions}}

  Rules:
  - Judge only the code I pasted; if you need surrounding code to be sure, ask instead of guessing.
  - Rank findings as must-fix (bugs, data loss, security), should-fix and nit, and give location, reason and a concrete suggestion for each.
  - Put the review focus first, but mention a serious problem anywhere you see one.
  - Say what the change does well in at most two sentences.
  - Do not invent APIs, functions, library versions, CLI flags or CVE numbers. If you are not sure something exists in my language, runtime or library version, say so and tell me to check the official docs.
  - Ask for the language, runtime and library versions if I left them out or wrote 'unknown', and say which assumptions you made.
  - Use placeholders and example.com for hostnames, paths, keys and credentials; never ask me to paste real secrets, and tell me to remove any I pasted by mistake.
  - Do not rewrite the whole change; show only the lines that need to move.

  Return a one-sentence summary of the change, the findings by group, and a list of tests that would raise confidence.
  Quality check: confirm every finding points to a location in the pasted code and no API or library feature is named that you are unsure exists.
