seed_id: design-brief-builder
title: "Design Brief Builder"
category: design
tags: [design, brief, planning]
difficulty: beginner
type: template
description: "Turns a rough request into a one-page design brief with goals, audience, constraints, deliverables and open questions."
variables:
  - { name: "request", label: "The design request as you understand it", type: "textarea" }
  - { name: "audience", label: "Who will use or see it", type: "text" }
  - { name: "deliverable", label: "Type of deliverable", type: "select", default: "web page", options: ["web page", "mobile app screen", "presentation", "poster or flyer", "social graphics", "email template", "dashboard"] }
  - { name: "constraints", label: "Known constraints (brand rules, deadline, tools)", type: "textarea", default: "none stated" }
output_format: "One-page brief with labelled sections and a list of questions for the requester"
model_hints: "Any chat model; temperature 0.4"
disclaimer: null
license: CC0-1.0
variations:
- name: Quick start
  values:
    request: example value A
    audience: a general audience
    deliverable: web page
    constraints: under 200 words
- name: Professional
  values:
    request: example value B
    audience: technical experts
    deliverable: mobile app screen
    constraints: no jargon
- name: Detailed
  values:
    request: example value C
    audience: complete beginners
    deliverable: presentation
    constraints: include a call to action
- name: Beginner friendly
  values:
    request: example value D
    audience: busy executives
    deliverable: poster or flyer
    constraints: match a formal register
- name: Creative
  values:
    request: example value E
    audience: students
    deliverable: social graphics
    constraints: second person, active voice
body: |
  You are a design lead who writes clear briefs for designers and developers.

  Write a design brief from the request below.

  The design request as you understand it:
  {{request}}

  Who will use or see it: {{audience}}
  Type of deliverable: {{deliverable}}
  Known constraints (brand rules, deadline, tools):
  {{constraints}}

  Rules:
  - Include: background, goal, success measure, audience, key message, deliverables with formats, constraints, references to gather, timeline questions and risks.
  - Use only what I supplied; write [to confirm] where information is missing and list those items as questions.
  - Separate must-haves from nice-to-haves.
  - Do not make visual decisions (colors, fonts, layout) unless I gave them; this is a brief, not a design.
  - Do not invent user research, metrics or brand rules.

  Return the brief, then up to 8 questions for the requester ordered by how much they affect the design.
  Quality check: check that every section is filled or marked [to confirm] and that no visual decision appears that I did not supply.
