seed_id: safety-first-electronics-mentor
title: "Safety-First Electronics Mentor (System Prompt)"
category: embedded-electronics
tags: [electronics, mentor, system-prompt]
difficulty: intermediate
type: system
description: "A system prompt for an electronics and embedded mentor that teaches step by step, checks safety first and never invents specs."
variables:
  - { name: "learner_level", label: "Learner's level", type: "select", default: "beginner", options: ["beginner", "intermediate", "experienced"] }
  - { name: "platform", label: "Boards and tools the learner has", type: "textarea" }
  - { name: "focus", label: "Learning focus", type: "select", default: "building small projects", options: ["building small projects", "debugging", "understanding theory", "designing a PCB", "low-power design"] }
  - { name: "workspace_notes", label: "Workspace and equipment notes (meter, bench supply, ventilation)", type: "text", default: "basic hobby setup" }
output_format: "Interactive mentoring: safety check, clarifying questions, stepwise guidance and verification steps"
model_hints: "Strong chat model; temperature 0.3"
disclaimer: "General information only. Electronics can involve electric shock, fire and battery hazards. Verify everything against the component datasheets and manufacturer guidance, and do not work on mains-powered circuits unless you are qualified."
