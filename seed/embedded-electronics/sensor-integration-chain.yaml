seed_id: sensor-integration-chain
title: "Sensor Integration Plan Chain"
category: embedded-electronics
tags: [sensors, integration, chain]
difficulty: advanced
type: chain
description: "A chain that plans wiring and firmware for a sensor, then a bench test script, then a failure diagnosis table."
variables:
  - { name: "sensor", label: "Sensor or module and what it measures", type: "text" }
  - { name: "board", label: "Microcontroller or board and framework", type: "text", default: "unknown" }
  - { name: "interface", label: "Interface", type: "select", default: "I2C", options: ["I2C", "SPI", "UART", "analog", "digital pin", "one-wire style", "not sure"] }
  - { name: "datasheet_notes", label: "Datasheet excerpts or module notes (voltages, addresses, timing)", type: "textarea", default: "none supplied" }
  - { name: "environment", label: "Operating environment and power source", type: "textarea" }
output_format: "Three labelled steps: integration plan, bench test script, failure diagnosis table"
model_hints: "Strong chat model; temperature 0.2"
disclaimer: null
license: CC0-1.0
variations:
- name: Quick start
  values:
    sensor: example value A
    board: example value A
    interface: I2C
    datasheet_notes: '2024-01: 1,200 users; 2024-02: 1,450 users; 2024-03: 1,390 users'
    environment: example value A
- name: Professional
  values:
    sensor: example value B
    board: example value B
    interface: SPI
    datasheet_notes: 'Product A: 45% margin; Product B: 32% margin; Product C: 51% margin'
    environment: example value B
- name: Detailed
  values:
    sensor: example value C
    board: example value C
    interface: UART
    datasheet_notes: Q1 revenue $1.2M, Q2 $1.5M, Q3 $1.1M, Q4 $1.8M
    environment: example value C
- name: Beginner friendly
  values:
    sensor: example value D
    board: example value D
    interface: analog
    datasheet_notes: 'Support tickets: Jan 320, Feb 290, Mar 410, Apr 380'
    environment: example value D
- name: Creative
  values:
    sensor: example value E
    board: example value E
    interface: digital pin
    datasheet_notes: 'Churn by cohort: 2023-Q1 8%, 2023-Q2 6%, 2023-Q3 5%, 2023-Q4 4%'
    environment: example value E
body: |
  You are an embedded engineer who integrates sensors into small systems.

  Work through the three steps for the sensor below.

  Sensor project:

  Sensor or module and what it measures: {{sensor}}
  Microcontroller or board and framework: {{board}}
  Interface: {{interface}}
  Datasheet excerpts or module notes (voltages, addresses, timing):
  {{datasheet_notes}}

  Operating environment and power source:
  {{environment}}

  Step 1 - Plan: describe the connection plan in words (power, ground, signal lines, pull-ups or level shifting if needed), the firmware structure (init, read, validate, filter) and the questions I must answer from the datasheet.
  Step 2 - Bench test: write a step-by-step test script to run on the bench in order: power checks with a current-limited supply, a read-back or identification check, a known-condition check and a noise check. Say what a pass looks like without inventing numbers.
  Step 3 - Diagnosis: build a table of likely failures (no response, wrong values, intermittent, noisy) with causes and the next test for each.

  Rules:
  - Use pin names, addresses and voltages only from my notes; otherwise write [check datasheet].
  - Do not name library functions or versions you are not sure exist in my framework; describe the code logic or ask me for the framework version.
  - Flag the hazard if the environment involves mains voltage, large batteries, high temperatures or chemicals, and tell me to follow manufacturer guidance.
  - Do not invent part numbers, pin assignments, register names, electrical limits or specifications, and never present any as verified; use values only from the datasheet excerpts I give, or mark them [check datasheet].
  - Safety first: remind me to check the mains-voltage, battery, heat and fume hazards that apply, to follow component datasheets and manufacturer guidance, and to stop and ask a qualified person before anything involving mains voltage, large batteries or unfamiliar high-energy circuits.

  Return the three steps as labelled sections.
  Quality check: confirm no address, pin or voltage appears that was not in my notes and that the test script starts with power checks.
