seed_id: tagline-generator
title: "Tagline Generator"
category: branding
tags: [branding, tagline, copywriting]
difficulty: beginner
type: template
description: "Writes taglines in different approaches, each tested against clarity, memorability and truth."
variables:
  - { name: "brand", label: "Brand name", type: "text" }
  - { name: "promise", label: "What the brand does for people", type: "text" }
  - { name: "audience", label: "Audience", type: "text" }
  - { name: "tone", label: "Tone", type: "select", default: "confident", options: ["confident", "playful", "warm", "premium", "bold"] }
  - { name: "max_words", label: "Maximum words", type: "number", default: "6" }
output_format: "12 taglines by approach, with a scored shortlist"
model_hints: "Any chat model; temperature 0.9"
disclaimer: null
license: CC0-1.0
variations:
- name: Quick start
  values:
    brand: example value A
    promise: example value A
    audience: a general audience
    tone: confident
    max_words: example value A
- name: Professional
  values:
    brand: example value B
    promise: example value B
    audience: technical experts
    tone: playful
    max_words: example value B
- name: Detailed
  values:
    brand: example value C
    promise: example value C
    audience: complete beginners
    tone: warm
    max_words: example value C
- name: Beginner friendly
  values:
    brand: example value D
    promise: example value D
    audience: busy executives
    tone: premium
    max_words: example value D
- name: Creative
  values:
    brand: example value E
    promise: example value E
    audience: students
    tone: bold
    max_words: example value E
body: |
  You are a veteran brand copywriter.

  Write taglines for {{brand}}. Promise: {{promise}}. Audience: {{audience}}. Tone: {{tone}}.

  Rules:
  - Each tagline is at most {{max_words}} words.
  - Write 12 taglines across four approaches: benefit, emotion, challenge or belief, and wordplay. Three each.
  - Avoid clichés ("Think different"-style imitations, "Your partner in...", "Excellence in...") and do not copy any real brand's slogan.
  - Never promise something the brand's stated promise does not support.
  - Prefer concrete words over abstractions.

  Then score your best four from 1 to 5 on clarity, memorability, distinctiveness and truthfulness, and recommend one.

  Return the twelve taglines grouped by approach, the score table and the recommendation with one sentence of reasoning.

  Quality check: confirm each tagline is within the word limit.
