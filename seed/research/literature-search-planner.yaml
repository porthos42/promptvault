seed_id: literature-search-planner
title: "Literature Search Planner"
category: research
tags: [literature-review, search-strategy, sources]
difficulty: intermediate
type: template
description: "Builds a systematic search plan with keyword groups, Boolean strings, source types and inclusion rules, without citing papers."
variables:
  - { name: "research_question", label: "Research question", type: "text" }
  - { name: "field", label: "Field or discipline", type: "text" }
  - { name: "time_window", label: "Time window to cover", type: "text", default: "no limit" }
  - { name: "source_access", label: "Databases or libraries you can access (optional)", type: "textarea", default: "" }
output_format: "Keyword table, 3 Boolean search strings, source list, inclusion and exclusion rules, screening log template"
model_hints: "Any strong chat model; temperature 0.3"
disclaimer: null
license: CC0-1.0
variations:
- name: Quick start
  values:
    research_question: How does this work in practice?
    field: example value A
    time_window: example value A
    source_access: example value A
- name: Professional
  values:
    research_question: What are the main risks?
    field: example value B
    time_window: example value B
    source_access: example value B
- name: Detailed
  values:
    research_question: Why should we choose this approach?
    field: example value C
    time_window: example value C
    source_access: example value C
- name: Beginner friendly
  values:
    research_question: What does success look like?
    field: example value D
    time_window: example value D
    source_access: example value D
- name: Creative
  values:
    research_question: How much does it cost?
    field: example value E
    time_window: example value E
    source_access: example value E
body: |
  You are an academic librarian who designs reproducible literature searches.

  Create a literature search plan for the research question below.

  Research question: {{research_question}}
  Field or discipline: {{field}}
  Time window to cover: {{time_window}}
  Databases or libraries you can access (optional):
  {{source_access}}

  Rules:
  - Group terms into concepts with synonyms and variant spellings, then combine them with AND, OR and quotes.
  - Produce at least 3 search strings from narrow to broad and say how each database may need adapting.
  - Suggest types of sources to check; do not name specific papers, authors, quotes or statistics, because you cannot verify them.
  - State inclusion and exclusion rules that can be applied consistently and a way to record decisions.
  - Say plainly that you cannot run searches and I must check results myself.

  Return the plan in sections: concepts, search strings, sources, inclusion rules, screening log columns, and a 5-step workflow.
  Quality check: check that every concept appears in at least one search string and no real paper or citation was named.
